<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>JOHN // Incident Admin Dashboard</title>
<style>
:root {
  --bg-dark: #07090e;
  --bg-card: #0d121b;
  --border-color: #1f2937;
  --accent-cyan: #00ffcc;
  --accent-red: #ff3333;
  --text-main: #cfd8dc;
  --text-muted: #8b949e;
}
body {
  background: var(--bg-dark);
  color: var(--text-main);
  font-family: "Courier New", Courier, monospace;
  margin: 0; padding: 30px;
}
h1 {
  color: var(--accent-cyan);
  font-size: 1.5rem;
  border-bottom: 1px dashed var(--border-color);
  padding-bottom: 10px;
}
.stats-container {
  display: flex;
  gap: 20px;
  margin-bottom: 25px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  padding: 15px 20px;
  border-radius: 6px;
  flex: 1;
}
.stat-label {
  font-size: 0.75rem;
  color: var(--text-muted);
  text-transform: uppercase;
}
.stat-value {
  font-size: 1.4rem;
  font-weight: bold;
  color: #fff;
  margin-top: 5px;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  overflow: hidden;
  font-size: 0.85rem;
}
th, td {
  padding: 12px 15px;
  text-align: left;
  border-bottom: 1px solid var(--border-color);
}
th {
  background: #11161d;
  color: var(--accent-cyan);
  text-transform: uppercase;
  font-size: 0.75rem;
}
tr:hover {
  background: rgba(0, 255, 204, 0.03);
}
.ip-badge {
  color: #ffcc00;
  font-weight: bold;
}
.refresh-btn {
  background: transparent;
  border: 1px solid var(--accent-cyan);
  color: var(--accent-cyan);
  padding: 8px 16px;
  border-radius: 4px;
  cursor: pointer;
  font-family: monospace;
  font-weight: bold;
  margin-bottom: 20px;
}
.refresh-btn:hover {
  background: rgba(0, 255, 204, 0.1);
}
</style>
</head>
<body>

  <h1>🛡️ JOHN OPS // Incident Command & Access Monitor</h1>
  
  <div style="margin-bottom: 15px;">
    <button class="refresh-btn" onclick="location.reload()">🔄 Logsを更新する</button>
    <span style="font-size: 0.8rem; color: var(--text-muted); margin-left: 10px;">※自動的にサーバーのactivity_logsからデータを取得しています。</span>
  </div>

  <div class="stats-container">
    <div class="stat-card">
      <div class="stat-label">総アクセス・操作ログ数</div>
      <div class="stat-value" id="total-logs">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">ユニークIP（訪問者数）</div>
      <div class="stat-value" id="unique-ips">0</div>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Client IP Address</th>
        <th>Action / Event Details</th>
      </tr>
    </thead>
    <tbody id="log-table-body">
      <!-- JavaScriptで動的挿入 -->
    </tbody>
  </table>

<script>
async function fetchLogs() {
  try {
    const response = await fetch('/dark_portal/api/logs');
    const logs = await response.json();
    
    document.getElementById('total-logs').innerText = logs.length;
    
    // ユニークIPの計算
    const uniqueIps = new Set(logs.map(log => log.ip)).size;
    document.getElementById('unique-ips').innerText = uniqueIps;
    
    const tbody = document.getElementById('log-table-body');
    tbody.innerHTML = '';
    
    // 新しいログを上部に表示するため逆順にする
    logs.slice().reverse().forEach(log => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${log.time}</td>
        <td><span class="ip-badge">${log.ip}</span></td>
        <td>${log.action}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch (error) {
    console.error('Failed to fetch logs:', error);
  }
}

// 読み込み時に取得
fetchLogs();
// 5秒ごとに自動更新
setInterval(fetchLogs, 5000);
</script>

</body>
</html>
