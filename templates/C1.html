<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberLab - C1 Target Agent Sandbox</title>
    <style>
        :root {
            --bg-color: #050509;
            --terminal-bg: #020205;
            --card-bg: #0f101a;
            --text-main: #f8fafc;
            --text-muted: #64748b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --border: #1e1b4b;
            --terminal-text: #7dd3fc;
            --success-text: #4ade80;
            --error-text: #f87171;
        }
        body { font-family: "Courier New", Consolas, monospace; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 2rem; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 950px; }
        h1 { font-size: 1.3rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.75rem; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        .back-link { font-size: 0.8rem; background: var(--border); color: var(--text-muted); padding: 0.3rem 0.6rem; border-radius: 4px; text-decoration: none; }
        .back-link:hover { color: var(--text-main); background: var(--accent-hover); }
        .card { background-color: var(--card-bg); padding: 1.5rem; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; }
        button { width: 100%; padding: 0.7rem; background-color: var(--accent); color: #020205; border: none; border-radius: 4px; font-size: 0.95rem; font-weight: bold; cursor: pointer; font-family: inherit; transition: background 0.2s; }
        button:hover { background-color: var(--accent-hover); color: white; }
        button:disabled { background-color: var(--border); color: var(--text-muted); cursor: not-allowed; }
        .btn-danger { background-color: #ef4444; color: white; }
        .btn-danger:hover { background-color: #dc2626; }
        .terminal-box { background-color: var(--terminal-bg); border: 1px solid var(--border); border-radius: 6px; padding: 1rem; min-height: 220px; max-height: 320px; overflow-y: auto; font-size: 0.85rem; color: var(--terminal-text); white-space: pre-wrap; word-break: break-word; line-height: 1.4; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); margin-bottom: 1rem; }
        ul { margin: 0; padding-left: 1.2rem; color: var(--text-muted); font-size: 0.85rem; }
        input { width: 100%; padding: 0.6rem; border-radius: 4px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); box-sizing: border-box; font-family: inherit; font-size: 0.9rem; }
        .status-ok { font-size: 0.85rem; color: var(--success-text); }
        .status-err { font-size: 0.85rem; color: var(--error-text); }
        .err-line { color: var(--error-text); }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>$ cyberlab --c1-target-agent-node</span>
            <a href="/" class="back-link">[ ホームに戻る ]</a>
        </h1>

        <div class="card">
            <label>ターゲット環境情報 (Sandbox Node)</label>
            <div id="targetInfo" class="status-ok">情報を取得中...</div>
        </div>

        <div class="card">
            <label>サンドボックス内ファイル ({{ sandbox }})</label>
            <ul id="fileList" style="margin-bottom: 1rem;">
                {% for f in files %}
                <li>{{ f }}</li>
                {% endfor %}
            </ul>
            <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                <button type="button" id="lockBtn" class="btn-danger" onclick="lockFiles()">ファイルを暗号化する (ロック)</button>
            </div>
            <div style="display: flex; gap: 1rem;">
                <input type="text" id="keyInput" placeholder="復元キーを入力 (空欄なら保存済みの secret.key を使用)">
                <button type="button" id="unlockBtn" onclick="unlockFiles()" style="background-color: var(--success-text); color: #020205;">復元する</button>
            </div>
        </div>

        <div class="card">
            <label for="customCmd">エージェント自己テスト用コマンド実行 (候補: AUDIT_SYS, ps aux, procs, GET_PROCS)</label>
            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                <input type="text" id="customCmd" list="cmdPresets" value="AUDIT_SYS">
                <datalist id="cmdPresets">
                    <option value="AUDIT_SYS"></option>
                    <option value="ps aux"></option>
                    <option value="procs"></option>
                    <option value="GET_PROCS"></option>
                </datalist>
                <button type="button" id="execBtn" onclick="runCommand()">EXECUTE</button>
            </div>
        </div>

        <div class="terminal-box" id="terminalOutput">[C1 Agent Node Initialized]
ターゲット端末としてのサンドボックス・ファイル保護状態を監視・操作できます。</div>
    </div>

    <script>
        const terminalOutput = document.getElementById('terminalOutput');
        const targetInfo = document.getElementById('targetInfo');

        function appendTerminal(text, isError = false) {
            const div = document.createElement('div');
            if (isError) div.className = 'err-line';
            div.textContent = text;
            terminalOutput.appendChild(div);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        async function fetchStatus() {
            try {
                const res = await fetch('api/status');
                const data = await res.json();
                if (!res.ok) {
                    targetInfo.className = 'status-err';
                    targetInfo.textContent = 'ステータスの取得に失敗しました';
                    return;
                }
                targetInfo.className = 'status-ok';
                targetInfo.textContent =
                    `OS: ${data.system} ${data.release} | User: ${data.current_user} | Root: ${data.is_elevated_root} | Dir: ${data.working_directory}`;
            } catch (err) {
                targetInfo.className = 'status-err';
                targetInfo.textContent = 'ステータスの取得に失敗しました';
            }
        }
        fetchStatus();

        async function runCommand() {
            const cmdInput = document.getElementById('customCmd');
            const execBtn = document.getElementById('execBtn');
            const command = cmdInput.value.trim();
            if (!command) return;

            execBtn.disabled = true;
            appendTerminal(`\n\n$ ${command}`);

            try {
                const res = await fetch('api/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ command })
                });
                const data = await res.json();
                if (res.ok) {
                    appendTerminal(`\n${data.output}`);
                } else {
                    const allowed = Array.isArray(data.allowed_commands)
                        ? ` (許可コマンド: ${data.allowed_commands.join(', ')})`
                        : '';
                    appendTerminal(`\n[ERROR] ${data.error || '実行に失敗しました'}${allowed}`, true);
                }
            } catch (err) {
                appendTerminal(`\n[COMMUNICATION ERROR] ${err.message}`, true);
            } finally {
                execBtn.disabled = false;
            }
        }

        async function lockFiles() {
            if (!confirm("サンドボックス内のファイルを暗号化しますか？")) return;
            const lockBtn = document.getElementById('lockBtn');
            lockBtn.disabled = true;
            try {
                const res = await fetch('api/lock', { method: 'POST' });
                const data = await res.json();
                alert(data.message || '暗号化処理が完了しました');
                location.reload();
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
            } finally {
                lockBtn.disabled = false;
            }
        }

        async function unlockFiles() {
            const key = document.getElementById('keyInput').value.trim();
            const unlockBtn = document.getElementById('unlockBtn');
            unlockBtn.disabled = true;
            try {
                const res = await fetch('api/unlock', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key })
                });
                const data = await res.json();
                if (res.ok) {
                    alert(data.message || '復元に成功しました');
                    location.reload();
                } else {
                    alert("エラー: " + (data.message || '復元に失敗しました'));
                }
            } catch (err) {
                alert("通信エラーが発生しました: " + err.message);
            } finally {
                unlockBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
